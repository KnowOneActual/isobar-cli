name: Full Security Scan (Python/JS/Bash)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create results directory
        run: mkdir -p sast-results

      # Deps/FS scan (Python/JS/Bash files)
      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'sast-results/trivy.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # Python security (insecure code)
      - name: Bandit Python scan
        run: |
          pip install bandit
          bandit -r . -f sarif -o sast-results/bandit.sarif -c .bandit || true

      # JS/HTML/Python security
      - name: Semgrep Scan
        run: |
          python3 -m pip install semgrep
          semgrep scan --sarif --output=sast-results/semgrep.sarif --config=auto || true

      # Bash script lint/security
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning

      # Upload all to GitHub Security tab
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        with:
          sarif_file: sast-results
