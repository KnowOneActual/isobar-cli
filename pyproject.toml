[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isobar-cli"
version = "0.4.1"
description = "A visually pleasing terminal weather tool focusing on Real Feel and Windchill."
authors = [
  { name="Beau Bremer /KnowOneActual" },
]
dependencies = [
  "rich>=13.0.0",
  "requests>=2.31.0",
  "typer>=0.9.0",
  "timezonefinder>=6.0.0",
]
requires-python = ">=3.8"

[project.scripts]
isobar = "src.main:app"  # This allows you to type 'isobar' in the terminal to run it

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
