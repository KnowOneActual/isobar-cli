[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isobar-cli"
version = "1.3.4"
description = "A terminal weather tool with industrial aesthetic, focusing on Real Feel and Windchill."
authors = [
  { name="Beau Bremer / KnowOneActual" },
]
readme = "README.md"
license = "MIT"
keywords = ["weather", "cli", "terminal", "meteo", "forecast"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
dependencies = [
  "rich>=13.0.0",
  "requests>=2.31.0",
  "typer>=0.9.0",
  "timezonefinder>=6.0.0",
]
requires-python = ">=3.8"
  
  [project.urls]
  Homepage = "https://github.com/KnowOneActual/isobar-cli"
  Repository = "https://github.com/KnowOneActual/isobar-cli"
  Issues = "https://github.com/KnowOneActual/isobar-cli/issues"
  Changelog = "https://github.com/KnowOneActual/isobar-cli/blob/main/CHANGELOG.md"
  
  [project.optional-dependencies]
  
  test = [
      "pytest>=7.0.0",
      "requests-mock>=1.11.0",
      "pytest-cov>=4.1.0",
  ]
  timezone = [
      "pytz>=2024.1",
  ]

[project.scripts]
isobar = "isobar_cli.main:app"  # This allows you to type 'isobar' in the terminal to run it

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["isobar_cli"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/isobar_cli --cov-report=term-missing"
