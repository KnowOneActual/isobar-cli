[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isobar-cli"
version = "0.3.0"
description = "A visually pleasing terminal weather tool focusing on Real Feel and Windchill."
authors = [
  { name="Beau Bremer /KnowOneActual" },
]
dependencies = [
  "rich>=13.0.0",
  "requests>=2.31.0",
  "typer>=0.9.0",
]
requires-python = ">=3.8"

[project.scripts]
isobar = "src.main:app"  # This allows you to type 'isobar' in the terminal to run it

[tool.setuptools]
packages = ["src"]